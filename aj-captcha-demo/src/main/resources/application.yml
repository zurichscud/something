server:
  port: 8080

spring:
  application:
    name: aj-captcha-demo
  # 静态资源在 resources/static 下，Spring Boot 默认已经映射到 http://localhost:8080/
  mvc:
    favicon:
      enabled: false

# ===== AJ-Captcha 配置（前缀 aj.captcha，对应 AjCaptchaProperties）=====
aj:
  captcha:
    # 验证码类型：default 表示同时初始化滑动拼图、文字点选等所有类型，
    # 具体用哪个由前端的 captchaType 决定：blockPuzzle / clickWord / curveSlider
    type: default

    # 滑动拼图底图目录，classpath: 开头的路径取 resources 下的目录
    # 约定目录结构：{jigsaw}/original/*.jpg|png 底图，{jigsaw}/slidingBlock/*.png 拼图块
    # 底图建议 310×155，拼图块 47×155（与官方前端组件的坐标换算保持一致）
    jigsaw: classpath:images/jigsaw

    # 文字点选底图目录，约定目录结构：{pic-click}/*.png，建议 310×155
    pic-click: classpath:images/pic-click

    # 右下角水印文字；水印字体可写 jar 内置字体名（fonts/WenQuanZhengHei.ttf）或系统字体名
    water-mark: 我的水印
    water-font: WenQuanZhengHei.ttf
    # 点选文字验证码使用的字体
    font-type: WenQuanZhengHei.ttf
    font-style: 1
    font-size: 25

    # 缓存：local 为内存缓存（单机部署用），分布式部署请实现 CaptchaCacheService 接入 Redis
    cache-type: local
    # 内存缓存达到该数量后触发清理；定时清理过期缓存，单位秒
    cache-number: 1000
    timing-clear: 180

    # 滑动拼图允许的误差像素；文字点选的误差为 font-size
    slip-offset: 5
    # 坐标 AES 加密开关，前端会用 repData.secretKey 加密坐标后回传
    aes-status: true
    # 滑动干扰项 0/1/2，值越大干扰图越多；干扰图会插在底图上缺口两侧，
    # 需要底图足够宽（≥ jigsawWidth*2 + 缺口两侧留白），310px 宽的底图请保持 0，
    # 否则可能出现 "bound must be positive" 而返回 6112。
    interference-options: 0

    # 历史数据清理开关（应用关闭时清理缓存中的验证码）
    history-data-clear-enable: false

    # 接口频率限制，默认关闭；开启后按 IP+UA 计数，校验失败过多会锁定
    req-frequency-limit-enable: false
    req-get-lock-limit: 5
    req-get-lock-seconds: 360
    req-get-minute-limit: 30
    req-check-minute-limit: 30

logging:
  level:
    com.anji.captcha: info
    com.example.ajcaptcha: info
