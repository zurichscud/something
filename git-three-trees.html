<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作区、暂存区与仓库 · Git 三区模型</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Songti SC', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.75rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 1rem;
      line-height: 1.55;
      color: var(--color-muted);
      max-width: 54ch;
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Git · Three Trees</p>
    <h1>工作区、暂存区与仓库</h1>
    <p class="subtitle">Git 把一份改动分成三段存放。命令只在相邻的两段之间搬运内容，逐格前进，也逐格退回。</p>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="git-three-trees-title git-three-trees-desc">
        <title id="git-three-trees-title">工作区、暂存区与仓库</title>
        <desc id="git-three-trees-desc">Git 三区模型：改动从工作区经 git add 进入暂存区，再由 git commit 写入本地仓库；git reset 与 git restore 把内容退回前一区。暂存区与本地仓库都位于 .git 目录内。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone: .git directory (drawn before arrows and nodes) -->
        <rect x="372" y="200" width="544" height="168" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="380" y="204" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="394" y="213" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.14em">.git</text>

        <!-- Arrows first (behind boxes) -->
        <line x1="248" y1="268" x2="392" y2="268" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <line x1="392" y1="308" x2="248" y2="308" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="572" y1="268" x2="716" y2="268" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="716" y1="308" x2="572" y2="308" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Arrow labels: mask sits 8px off its stroke -->
        <rect x="292" y="248" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="257" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">git add</text>

        <rect x="284" y="316" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="325" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">git restore</text>

        <rect x="608" y="248" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="644" y="257" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">git commit</text>

        <rect x="612" y="316" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="644" y="325" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">git reset</text>

        <!-- Node 1: working tree -->
        <rect x="68" y="232" width="180" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="68" y="232" width="180" height="112" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="76" y="240" width="56" height="16" rx="2" fill="none" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="104" y="251" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">WORKTREE</text>
        <text x="158" y="294" fill="#2d3142" font-size="12" font-weight="600"
              font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif"
              text-anchor="middle">工作区</text>
        <text x="158" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">modified</text>

        <!-- Node 2: index (focal) -->
        <rect x="392" y="232" width="180" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="392" y="232" width="180" height="112" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="400" y="240" width="44" height="16" rx="2" fill="none" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="422" y="251" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">INDEX</text>
        <text x="482" y="294" fill="#2d3142" font-size="12" font-weight="600"
              font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif"
              text-anchor="middle">暂存区</text>
        <text x="482" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">staged</text>

        <!-- Node 3: local repository -->
        <rect x="716" y="232" width="180" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="716" y="232" width="180" height="112" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="724" y="240" width="52" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="750" y="251" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">OBJECTS</text>
        <text x="806" y="294" fill="#2d3142" font-size="12" font-weight="600"
              font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif"
              text-anchor="middle">本地仓库</text>
        <text x="806" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">committed</text>

        <!-- Annotation callout: top-right margin, leader to the index node -->
        <text x="892" y="96" fill="#2d3142" font-size="14" font-style="italic"
              font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif"
              text-anchor="end">改动总是逐格移动：先入暂存区，才可能进仓库</text>
        <path d="M 590,106 Q 534,166 490,220" fill="none"
              stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="488" cy="226" r="2.5" fill="#2d3142"/>

        <!-- Legend: horizontal strip after all nodes -->
        <line x1="68" y1="482" x2="892" y2="482" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="68" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              letter-spacing="0.14em">LEGEND</text>
        <line x1="180" y1="504" x2="216" y2="504" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <text x="226" y="508" fill="#4f5d75" font-size="12" font-weight="500"
              font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif">写入版本库</text>
        <line x1="340" y1="504" x2="376" y2="504" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="386" y="508" fill="#4f5d75" font-size="12" font-weight="500"
              font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif">退回前一区</text>
      </svg>
    </div>
  </div>
</body>
</html>
