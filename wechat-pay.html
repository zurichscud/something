<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>微信支付 · 支付流程</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>微信支付 · 支付流程</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wechat-pay-title wechat-pay-desc">
        <title id="wechat-pay-title">微信支付 · 支付流程</title>
        <desc id="wechat-pay-desc">时序图展示微信支付 JSAPI 支付流程：用户客户端提交订单，商户后台调用统一下单接口获得预付单号并返回支付参数，用户拉起支付，微信支付平台向用户银行扣款成功后同步返回支付结果并异步通知商户后台。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- =================================================================
             LIFELINES — dashed vertical lines from each actor.
             Actor lifeline x-coords: 136, 384, 632, 840
             ================================================================= -->
        <line x1="136" y1="128" x2="136" y2="488" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="384" y1="128" x2="384" y2="488" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="632" y1="128" x2="632" y2="488" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="840" y1="128" x2="840" y2="488" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- =================================================================
             ACTIVATION BARS — w=8 rects on lifelines showing control duration.
             Drawn before message arrows so arrows land on their edges.
             ================================================================= -->
        <!-- 商户后台 activation: receives order y=168, returns params y=264 -->
        <rect x="380" y="172" width="8" height="92" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <!-- 商户后台 activation: receives notify y=424, acks y=456 -->
        <rect x="380" y="420" width="8" height="36" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <!-- 微信支付平台 activation: unified order y=200 through notify y=424 -->
        <rect x="628" y="204" width="8" height="220" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <!-- 用户银行 activation: debit request y=328, result y=360 -->
        <rect x="836" y="324" width="8" height="36" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- =================================================================
             MESSAGE ARROWS — time flows top→down.
             Draw before labels so label masks cover the line.
             ================================================================= -->

        <!-- M1: 用户客户端 → 商户后台  (提交订单 · link-blue) -->
        <line x1="136" y1="168" x2="384" y2="168" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- M2: 商户后台 → 微信支付平台  (统一下单 · link-blue) -->
        <line x1="384" y1="200" x2="632" y2="200" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- M3: 微信支付平台 → 商户后台  (返回预付单号 · muted dashed) -->
        <line x1="632" y1="232" x2="384" y2="232" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- M4: 商户后台 → 用户客户端  (返回支付参数 · muted dashed) -->
        <line x1="384" y1="264" x2="136" y2="264" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- M5: 用户客户端 → 微信支付平台  (拉起支付 · muted) -->
        <line x1="136" y1="296" x2="632" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- M6: 微信支付平台 → 用户银行  (扣款请求 · muted) -->
        <line x1="632" y1="328" x2="840" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- M7: 用户银行 → 微信支付平台  (扣款成功 · muted dashed return) -->
        <line x1="840" y1="360" x2="632" y2="360" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- M8: 微信支付平台 → 用户客户端  (支付结果 · headline success · coral) -->
        <line x1="632" y1="392" x2="136" y2="392" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- M9: 微信支付平台 → 商户后台  (异步通知 · muted) -->
        <line x1="632" y1="424" x2="384" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- M10: 商户后台 → 微信支付平台  (应答 · muted dashed return) -->
        <line x1="384" y1="456" x2="632" y2="456" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- =================================================================
             MESSAGE LABELS — opaque masks, 8px clear of each stroke.
             Chinese arrow labels switch register: 12px sans / 500 / no tracking.
             ================================================================= -->

        <!-- M1 label -->
        <rect x="228" y="144" width="64" height="16" rx="2" fill="#f5f5f5"/>
        <text x="260" y="157" fill="#2e5aa8" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">提交订单</text>

        <!-- M2 label -->
        <rect x="476" y="176" width="64" height="16" rx="2" fill="#f5f5f5"/>
        <text x="508" y="189" fill="#2e5aa8" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">统一下单</text>

        <!-- M3 label -->
        <rect x="464" y="208" width="88" height="16" rx="2" fill="#f5f5f5"/>
        <text x="508" y="221" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">返回预付单号</text>

        <!-- M4 label -->
        <rect x="216" y="240" width="88" height="16" rx="2" fill="#f5f5f5"/>
        <text x="260" y="253" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">返回支付参数</text>

        <!-- M5 label -->
        <rect x="228" y="272" width="64" height="16" rx="2" fill="#f5f5f5"/>
        <text x="260" y="285" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">拉起支付</text>

        <!-- M6 label -->
        <rect x="704" y="304" width="64" height="16" rx="2" fill="#f5f5f5"/>
        <text x="736" y="317" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">扣款请求</text>

        <!-- M7 label -->
        <rect x="704" y="336" width="64" height="16" rx="2" fill="#f5f5f5"/>
        <text x="736" y="349" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">扣款成功</text>

        <!-- M8 label (coral · primary success) -->
        <rect x="476" y="368" width="64" height="16" rx="2" fill="#f5f5f5"/>
        <text x="508" y="381" fill="#eb6c36" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">支付成功</text>

        <!-- M9 label -->
        <rect x="476" y="400" width="64" height="16" rx="2" fill="#f5f5f5"/>
        <text x="508" y="413" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">异步通知</text>

        <!-- M10 label -->
        <rect x="476" y="432" width="64" height="16" rx="2" fill="#f5f5f5"/>
        <text x="508" y="445" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">应答成功</text>

        <!-- =================================================================
             ACTOR BOXES — drawn after arrows/labels.
             Each actor: 144–160 wide × 56 tall. Centers: 136, 384, 632, 840.
             ================================================================= -->

        <!-- Actor 1: 用户客户端 (input / soft) -->
        <rect x="64" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="72" y="80" width="36" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="90" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="136" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">用户客户端</text>
        <text x="136" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">WeChat client</text>

        <!-- Actor 2: 商户后台 (backend / white) -->
        <rect x="312" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="312" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="320" y="80" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="338" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MERCH</text>
        <text x="384" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">商户后台</text>
        <text x="384" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">merchant server</text>

        <!-- Actor 3: 微信支付平台 (focal / coral) -->
        <rect x="552" y="72" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="552" y="72" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="560" y="80" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="580" y="89" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WXPAY</text>
        <text x="632" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">微信支付平台</text>
        <text x="632" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">openapi · v3</text>

        <!-- Actor 4: 用户银行 (external / muted) -->
        <rect x="768" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="768" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="776" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="792" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BANK</text>
        <text x="840" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">用户银行</text>
        <text x="840" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">issuer bank</text>

        <!-- =================================================================
             LEGEND — horizontal strip at the bottom.
             Separator at y=508, eyebrow at y=524, items at y=540.
             ================================================================= -->
        <line x1="64" y1="508" x2="912" y2="508" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="64" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <!-- Item 1: Focal actor (coral) -->
        <rect x="64" y="534" width="14" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="86" y="544" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">关键参与方</text>

        <!-- Item 2: Request / API call (link-blue) -->
        <line x1="200" y1="540" x2="230" y2="540" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="240" y="544" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">请求调用</text>

        <!-- Item 3: Return / ack (muted dashed) -->
        <line x1="340" y1="540" x2="370" y2="540" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="380" y="544" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">返回应答</text>

        <!-- Item 4: Primary success (coral) -->
        <line x1="470" y1="540" x2="500" y2="540" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="510" y="544" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">支付成功</text>

        <!-- Item 5: Activation -->
        <rect x="600" y="532" width="6" height="16" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="616" y="544" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">激活区间</text>
      </svg>
    </div>
  </div>
</body>
</html>
